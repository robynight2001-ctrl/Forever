    <script>
      // Suppress Vite HMR WebSocket connection errors in iframe / cloud preview environment
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('@vite/client') !== -1 || e.message.indexOf('createWebSocketModuleRunnerTransport') !== -1)) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('createWebSocketModuleRunnerTransport') !== -1)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
